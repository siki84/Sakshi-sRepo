# Copy to config.yaml (git-ignored) and fill in.

candidate:
  name: "Your Name"
  email: "you@example.com"
  phone: "+1 555 0100"
  location: "City, Country"
  linkedin_url: "https://www.linkedin.com/in/your-profile"

# Your full, honest master resume in Markdown. The agent tailors a copy per job
# and never invents experience that isn't in here or in details.md.
resume_file: profile/resume.md
# Anything else worth knowing: extra projects, preferences, salary range,
# visa status, roles you do NOT want, achievements not on the resume.
details_file: profile/details.md

search:
  queries:
    - keywords: "Data Analyst"
      location: "United States"
    - keywords: "Business Analyst"
      location: "Remote"
  posted_within_days: 7
  work_types: [remote, hybrid]     # any of onsite / remote / hybrid; [] for all
  easy_apply_only: true            # only postings the agent can actually submit
  max_results_per_query: 25
  min_score: 70                    # Claude's 0-100 fit score needed to draft
  max_drafts_per_run: 5            # caps how many review emails one search sends

email:
  your_address: "you@example.com"     # reviews go here; ONLY replies from here are obeyed
  agent_address: "you@example.com"    # mailbox the agent sends from / reads (can be the same)
  smtp_host: smtp.gmail.com
  smtp_port: 465
  imap_host: imap.gmail.com
  imap_port: 993
  password_env: JOB_AGENT_EMAIL_PASSWORD   # env var holding the mailbox (app) password

apply:
  mode: easy_apply        # easy_apply = submit on LinkedIn after approval; manual = email you the final files + link
  dry_run: true           # fill the form but stop before Submit. Set false once you trust it.
  headless: false         # show the browser while applying
  max_steps: 15
  # Answers to Easy Apply screening questions. Keys are matched case-insensitively
  # as substrings of the question text. Unknown required questions => it stops and emails you.
  screening_answers:
    "years of experience": "5"
    "authorized to work": "Yes"
    "require sponsorship": "No"
    "willing to relocate": "No"
    "notice period": "2 weeks"

model: claude-opus-5-5
data_dir: data
poll_seconds: 120
